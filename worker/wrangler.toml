name = "audit-task-force"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Buat dulu:  npx wrangler d1 create audit-task-force
# lalu ganti database_id di bawah dengan ID yang ditampilkan.
[[d1_databases]]
binding = "DB"
database_name = "audit-task-force"
database_id = "505140b7-6a01-4738-ad1d-9ebd73d35b27"

# OPSIONAL: foto di R2 (butuh aktivasi R2 dengan metode pembayaran).
# Tanpa ini foto disimpan di tabel `photos` D1. Untuk memakai R2:
#   npx wrangler r2 bucket create audit-foto   lalu hapus tanda # di 3 baris berikut.
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "audit-foto"

[vars]
# Hanya aplikasi web ini yang boleh memanggil API (CORS).
ALLOWED_ORIGIN = "https://task-force-audit-app.ariandialnotri.workers.dev"

# Secret (jangan ditulis di sini):  npx wrangler secret put SETUP_TOKEN
